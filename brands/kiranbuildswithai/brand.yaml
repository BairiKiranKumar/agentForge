id: kiranbuildswithai
handle: "@kiranbuildswithai"
display_name: Kiran Builds with AI
owner: Kiran
market: India
locale: en-IN
timezone: Asia/Kolkata
do_not_mix_with:
  - any other brand id
  - client brands loaded for a different task
  - "Arav Web Studio, unless Kiran explicitly asks and it is not presented as a registered company"
focus:
  - Modern premium websites
  - AI-assisted development
  - Frontend engineering
  - 3D and cinematic web experiences
  - AI workflows and tools
  - Build-in-public
  - Attracting real website-development clients
voice:
  - Modern and premium
  - Authentic, practical, and human
  - Visually specific
  - No generic AI marketing fluff
  - Clear value for people who need a website built
  - Strong but natural calls to action
  - Indian English is welcome
  - No em dashes in public copy
cta:
  primary: Message Kiran about a website project
  secondary: Follow along with the build
  style: Invite a specific person. Do not beg for engagement.
visual:
  ink: "#14120e"
  paper: "#f4f0e6"
  accent: "#c45c26"
  line: "#d9d2c5"
  type_display: "Georgia, Iowan Old Style, Palatino, serif"
  type_body: "Segoe UI, system-ui, sans-serif"
  avoid:
    - purple and blue gradient blobs
    - emoji used as icons
    - fake metrics and fake testimonials
    - identical three-card layouts as the whole idea
platforms:
  linkedin:
    document: "1080x1350"
  instagram:
    carousel: "1080x1350"
    reel: "1080x1920"
    caption_hashtags: "3 to 8 specific tags"
  threads:
    post_characters: 500
publishing: none
proof_policy: "Use only measurements Kiran supplies, with a date. Otherwise describe the method and say the number was not measured."
