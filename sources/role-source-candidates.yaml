# role-source-candidates.yaml
# For each role slug in orchestration/roster.yaml: up to 3 source files a builder should consult.
# Only repos whose license permits reuse with attribution are listed (MIT or Apache-2.0).
# Every path was checked to exist at the listed commit (shallow clones under /root/src).
# quality: strong = concrete method/checklists/templates usable with light adaptation;
#          partial = useful sections, needs real rewriting or localization;
#          weak = only topic coverage; write mostly original.
# "none (original)" = no usable permissive source found; write from scratch.
# Attribution: keep the LICENSE text from sources/licenses/<owner>__<repo>.LICENSE.txt and
# credit the repo + commit in the adapted file. Strip personas, credential claims and
# non-Indian jurisdiction rules when adapting.
