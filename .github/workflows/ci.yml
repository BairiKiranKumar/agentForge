name: validate

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - name: Role definitions
        run: python tools/validate.py
      - name: Generated indexes are up to date
        run: |
          python tools/build_indexes.py
          git diff --exit-code
      - name: Design knowledge base and skill registry
        run: python tools/design_kb.py validate
      - name: Engineering standards and quality gates
        run: python tools/quality_gate.py validate
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Secret scan
        run: python tools/scan_secrets.py
      - name: Privacy scan (generic detectors)
        run: python tools/privacy_scan.py

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt
