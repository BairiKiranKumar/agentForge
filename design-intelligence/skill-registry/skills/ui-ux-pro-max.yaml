status_reason: Broad and widely used, with a searchable local data set, but the repo bundles many Python scripts, an npm CLI and AI-image generation helpers that need API keys. Consider only the data-search skill, after script review.
categories: [visual-design-intelligence, ui-ux, design-systems, typography-layout, motion, accessibility, component-design]
capabilities:
  - Searchable local CSV data covering styles, product palettes, font pairings, UX guidelines, icons, GSAP presets, chart types and stack notes (counts are the author's claims)
  - Python search script (ui-ux-pro-max/scripts/core.py) to query the data
  - Companion skills in the same repo: brand, design, design-system, slides, banner-design, ui-styling
  - Cross-agent installer CLI (uipro init --ai ...)
limitations:
  - Counts such as 79 styles and 192 palettes were not verified
  - Repo is large and mixed; only one of seven skills is a pure reference skill
  - A generic style catalogue can push toward templated looks if used without a brief
  - Needs Python 3 for search scripts
