status_reason: Most capable design-critique and anti-pattern tool found, but it installs Claude Code hooks that run a native engine binary after every Edit or Write, downloads that binary from GitHub Releases, and has a large Rust and JS surface that was not reviewed. Not adoptable without a full security review.
categories: [design-critique, anti-pattern-detection, creative-frontend, browser-visual-testing, motion, responsive, accessibility]
capabilities:
  - One skill with 24 commands (craft, init, shape, critique, audit, polish, animate, bolder, quieter and others) as stated in README
  - 61 deterministic detector rules via a CLI and browser extension, no LLM needed (README claim)
  - Writes PRODUCT.md and DESIGN.md for durable context
  - Live browser iteration mode
limitations:
  - Heavy: Rust workspace, extension, VS Code package and Cursor plugin in one repo
  - Detector rule count and quality not verified by running it (running was forbidden)
  - Needs project init; writes context files into the target repo
compatible_agents: [claude-code, cursor]
install_method: "npx impeccable install, then /impeccable init; Claude Code plugin; Cursor plugin"
dependencies: [node or bun, prebuilt engine binary downloaded from GitHub Releases (ENGINE_VERSION pinned in repo), optional browser extension]
scripts_present: true
permissions_requested: [hooks on SessionStart, PostToolUse matcher Edit|Write, and Stop that execute scripts/impeccable; file write (PRODUCT.md, DESIGN.md); network download of engine binary; browser control in live mode]
risks: [auto-running hooks execute a downloaded native binary, binary download optionally verified by a .sha256 only when present, huge repo (about 750 MB size per API) not reviewable in full, repo moves fast so a pin goes stale quickly, telemetry not checked]
